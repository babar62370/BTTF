# SI TUTO MPF, EN FAIT C'EST CA
# [sound_system]
# music={"type": "solo"}
# effects={"type": "simultaneous", "simultaneous_sounds": 3, "default": true}
# voice={"type": "sequential"}

[sound_system]

[sound_system/music]
type = "solo"

[sound_system/effects]
type = "simultaneous"
simultaneous_sounds = 3
default = true

[sound_system/voice]
type = "sequential"
