# SUR MAC mettre /Applications/Godot.app/Contents/MacOS/Godot
# SUR MINI-PC mettre C:\Godot\Godot.exe ??????
#
# LA LIGNE ORIGINALE EST effects={"type": "simultaneous", "simultaneous_sounds": 3, "default": true}

[displays]
DefaultDisplay="Window"

[gmc]
exit_on_esc=true
logging_global=20