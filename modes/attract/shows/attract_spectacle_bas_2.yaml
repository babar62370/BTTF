#show_version=6
# loop: 3
- duration: 1
  lights:
    l_left_outlane: white
    l_right_outlane: white
- duration: 1
  lights:
    l_left_outlane: off
    l_right_outlane: off
    l_insert_shoot_again: white
- duration: 1
  lights:
    l_insert_shoot_again: off
    l_left_inlane_lower: floralwhite
    l_left_inlane_top: red
    l_right_inlane_lower: floralwhite
    l_right_inlane_top: red
- duration: 1
  lights:
    l_left_inlane_lower: off
    l_left_inlane_top: off
    l_right_inlane_lower: off
    l_right_inlane_top: off
    l_left_slingshot_lower: floralwhite
    l_left_slingshot_top: red
    l_right_slingshot_lower: floralwhite
    l_right_slingshot_top: red
- duration: 1
  lights:
    l_left_slingshot_lower: off
    l_left_slingshot_top: off
    l_right_slingshot_lower: off
    l_right_slingshot_top: off
    l_insert_left_inlane: white
    l_insert_right_inlane: white
- duration: 1
  lights:
    l_insert_left_inlane: off
    l_insert_right_inlane: off
    l_insert_left_outlane: white
    l_insert_right_outlane: white
# VALEUR SUPERIEURE A ZERO POUR LE DERNIER
- duration: 1
  lights:
    l_insert_left_outlane: off
    l_insert_right_outlane: off