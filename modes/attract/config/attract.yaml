#config_version=6

sound_player:
  mode_attract_started:
    theme_bttf:
      bus: music
  mode_attract_display_loop_started:
    bttf_attract:
      bus: music
  mode_attract_game_over_started:
    theme_theme:
      bus: music

slide_player:
  mode_attract_started:
    attract:
      target: DefaultDisplay
      action: play

show_player:
  mode_attract_started:
    attract_display_loop:
      action: play
      speed: 1
    attract_light_show:
      action: play
      speed: 4

