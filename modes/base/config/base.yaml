#config_version=6

# Base mode that starts at the beginning of each ball
# and stops at the end of each ball.

mode:
  start_events: ball_starting
  stop_events: ball_will_end
  priority: 100

sound_player:
  mode_attract_started:
    power_of_love:
      bus: music

slide_player:
  mode_base_started:
    base_infos:
      action: play

