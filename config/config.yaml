modes:
  - attract
  - base
  - einstein_multiball

hardware:
  platform: opp
  driverboards: cobrapin

opp:
  ports:
    - /dev/tty.usbmodem568441744C001
    - /dev/tty.usbmodem5683416F4C001

displays:
  DefaultDisplay:
    width: 1920
    height: 1080
    fps: 75

