coils:
  c_flipper_left_main:
    number: 0-0-8
    default_pulse_ms: 15
    default_hold_power: 0.125
    allow_enable: true
  c_flipper_left_mini_main:
    number: 0-0-9
    default_pulse_ms: 10
    default_hold_power: 0.10
    allow_enable: true
  c_flipper_right_bas_main:
    number: 0-0-10
    default_pulse_ms: 12
    default_hold_power: 0.125
    allow_enable: true
  c_flipper_right_haut_main:
    number: 0-0-11
    default_pulse_ms: 10
    default_hold_power: 0.10
    allow_enable: true
  c_flipper_right_mini_main:
    number: 0-0-0
    default_pulse_ms: 10
    default_hold_power: 0.10
    allow_enable: true
  c_trough_eject:
    number: 0-0-12
    default_pulse_ms: 20
  c_plunger_eject:
    number: 0-0-13
    default_pulse_ms: 25
  c_left_slingshot:
    number: 0-0-14
    default_pulse_ms: 10
  c_right_slingshot:
    number: 0-0-15
    default_pulse_ms: 10
  c_lower_jet_bumper:
    number: 0-0-7
    default_pulse_ms: 10
  c_left_jet_bumper:
    number: 0-0-6
    default_pulse_ms: 10
  c_right_jet_bumper:
    number: 0-0-5
    default_pulse_ms: 10
  c_left_popper:
    number: 0-0-4
    default_pulse_ms: 20
  c_right_popper:
    number: 0-0-3
    default_pulse_ms: 20
  c_deviateur_bras_actuate:
    number: 0-0-2
    default_pulse_ms: 30
  c_top_popper:
    number: 0-0-1
    default_pulse_ms: 20
  c_eject_bras_virtual:
    number: 1
    platform: virtual
    default_pulse_ms: 20

autofire_coils:
  left_slingshot:
    coil: c_left_slingshot
    switch: s_left_slingshot
  right_slingshot:
    coil: c_right_slingshot
    switch: s_right_slingshot
  lower_jet:
    coil: c_lower_jet_bumper
    switch: s_lower_jet
  left_jet:
    coil: c_left_jet_bumper
    switch: s_left_jet
  right_jet:
    coil: c_right_jet_bumper
    switch: s_right_jet

diverters:
  deviateur_rampe_bras:
    activation_coil: c_deviateur_bras_actuate
    type: pulse
    activate_events: multiball_lock_lock_einstein_enabled
    disable_events: multiball_lock_lock_einstein_disabled

servos:
  servo_bras_einstein:
    number: 1-0-11
    reset_position: 0.2
    debug: true
    positions:
      0.2: 0.2
      0.8: 0.8

servo_controllers:
  controleur_bras_einstein:
    servo: servo_bras_einstein
    control_events:
      - event: start_multiball_einstein
        position: 0.8
      - event: c_eject_bras_virtual_pulsed
        position: 0.8
      - event: multiball_einstein_ended
        position: 0.2
      - event: balldevice_bd_bras_rotatif_ball_ejected
        position: 0.2

flippers:
  left_flipper_main:
    main_coil: c_flipper_left_main
    activation_switch: s_left_flipper
    enable_events: machine_reset_phase_3
  left_flipper_mini:
    main_coil: c_flipper_left_mini_main
    activation_switch: s_left_flipper
    enable_events: machine_reset_phase_3
  right_flipper_bas:
    main_coil: c_flipper_right_bas_main
    activation_switch: s_right_flipper
    enable_events: machine_reset_phase_3
  right_flipper_haut:
    main_coil: c_flipper_right_haut_main
    activation_switch: s_right_flipper
    enable_events: machine_reset_phase_3
  right_flipper_mini:
    main_coil: c_flipper_right_mini_main
    activation_switch: s_right_flipper
    enable_events: machine_reset_phase_3

machine:
  balls_installed: 5
  min_balls: 5

game:
  balls_per_game: 5
  max_players: 4

virtual_platform_start_active_switches: s_trough1, s_trough2, s_trough3, s_trough4, s_trough5

ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3, s_trough4, s_trough5, s_trough_jam
    eject_coil: c_trough_eject
    tags: trough, home, drain
    jam_switch: s_trough_jam
    eject_coil_jam_pulse: 15ms
    eject_targets: bd_plunger
    eject_timeouts: 3s
    entrance_count_delay: 300ms
    debug: true
  bd_plunger:
    ball_switches: s_plunger
    entrance_count_delay: 300ms
    eject_timeouts: 5s
    eject_coil: c_plunger_eject
    player_controlled_eject_event: sw_launch
  bd_left_vuk:
    ball_switches: s_left_popper
    eject_coil: c_left_popper
    eject_timeouts: 2s
  bd_right_vuk:
    ball_switches: s_right_popper
    eject_coil: c_right_popper
    eject_timeouts: 2s
    eject_targets: playfield
  bd_upper_vuk:
    ball_switches: s_top_popper
    eject_coil: c_top_popper
    eject_timeouts: 2s
    eject_targets: bd_bras_rotatif
  bd_bras_rotatif:
    tags: lock
    ball_switches: s_bras_slot1, s_bras_slot2, s_bras_slot3
    eject_coil: c_eject_bras_virtual
    debug: true

playfields:
  playfield:
    default_source_device: bd_plunger
    tags: default

ball_saves:
  default_ball_save:
    active_time: 10s
    hurry_up_time: 2s
    grace_period: 1s
    enable_events: ball_started
    auto_launch: true

